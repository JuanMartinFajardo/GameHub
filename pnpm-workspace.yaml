# La parte de JavaScript del monorepo: los paquetes y la app de web/ y las UIs propias que viven
# dentro de cada paquete de juego (games/<juego>/ui).
packages:
  - "web/packages/*"
  - "web/apps/*"
  - "games/*/ui"

# Versiones exactas compartidas por todos los paquetes ("catalog:" en cada package.json).
catalog:
  "@biomejs/biome": 2.5.14
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.7
  "@types/node": 22.20.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/ws": 8.18.1
  "@vitejs/plugin-react": 6.1.1
  jsdom: 30.1.1
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.2
  ws: 8.21.3
