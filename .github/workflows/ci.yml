name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run pyright
      - name: Esquemas generados al día
        run: uv run gamehub ir schemas --check
      - name: Tipos del protocolo generados al día
        run: uv run gamehub protocol types --check
      - name: Juegos de validación
        run: uv run gamehub ir check ../spec/ir/examples/*.ir.json
      - name: Juegos y biblioteca estándar en Nomos formateados
        run: uv run gamehub fmt --check ../games ../stdlib
      - name: Juegos y biblioteca estándar en Nomos compilan sin errores
        run: uv run gamehub check ../games ../stdlib
      - name: Tests e invariantes de los juegos en Nomos
        run: uv run gamehub test ../games
      - name: Tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Los tests de integración arrancan el servidor de partidas de Python.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: python
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lint y formato
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: App web
        run: pnpm build
