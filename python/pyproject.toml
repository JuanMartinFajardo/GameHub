[project]
name = "gamehub"
version = "0.0.1"
description = "GameHub: diseñar, jugar y analizar juegos definidos formalmente (lenguaje Nomos)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Juan Martin Fajardo" }]
dependencies = [
  "jsonschema>=4.23",
  "pygls>=2.1",
  "referencing>=0.35",
  "segno>=1.6",
  "starlette>=0.46",
  "uvicorn>=0.34",
  "websockets>=14",
  "zeroconf>=0.136",
]

[project.optional-dependencies]
# Plugins nativos en WebAssembly (std.poker…): sin esto, se usa la implementación de referencia.
wasm = ["wasmtime>=36"]

[project.scripts]
gamehub = "gamehub.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.140",
  "pre-commit>=4.0",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "ruff>=0.8",
  "wasmtime>=36",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamehub"]

# La especificación (esquemas, catálogo, ejemplos) y la biblioteca estándar de Nomos viajan dentro
# del paquete: spec_dir() y stdlib_dir() las encuentran subiendo directorios, igual que en el repo.
[tool.hatch.build.targets.wheel.force-include]
"../spec" = "gamehub/spec"
"../stdlib" = "gamehub/stdlib"

# La app web compilada, si existe (ver hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Los textos están en español y usan tipografía no ASCII a propósito.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests marcados `slow` (perft profundos, playouts largos) solo con `-m slow`.
addopts = "-q -m 'not slow'"
markers = ["slow: tarda minutos con el motor de referencia (se ejecuta con -m slow)"]
# Si un test se cuelga (red, hilos), vuelca la pila de todos los hilos.
faulthandler_timeout = 120
# pygls usa asyncio.iscoroutinefunction, obsoleto en Python 3.14 (no es nuestro).
filterwarnings = ["ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning"]
